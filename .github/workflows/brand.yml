name: JTS Brand Compliance

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate JTS design and documentation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14.8'
      - uses: Jefferies-Tube-Solutions/jts-brand-checks@172c99e39fbe94cea769b00d8ac20c46cd811e57
